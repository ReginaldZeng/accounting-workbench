<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数字员工办公室 · 大屏</title>
<style>
  :root{
    --oat:#EAE4D8;
    --oat-deep:#DED7C6;
    --green:#758043;
    --green-deep:#415800;
    --ink:#333333;
    --ink-soft:#565656;
    --card:#FFFFFF;
    --ok:#3F7D3B;
    --warn:#B7791F;
    --idle:#8A8A82;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#1a1a18;overflow:hidden}
  body{
    font-family:"MiSans","MiSans Normal","Microsoft YaHei",微软雅黑,Arial,sans-serif;
    display:grid;place-items:center;
  }
  /* 固定 1920x1080，等比缩放塞进任何屏幕 */
  #stage{
    width:1920px;height:1080px;
    background:var(--oat);
    color:var(--ink);
    display:flex;flex-direction:column;
    transform-origin:center center;
    padding:44px 56px 36px;
  }

  /* ── 顶栏 ── */
  header{display:flex;align-items:baseline;gap:24px;padding-bottom:28px}
  .mark{
    width:34px;height:34px;flex:none;align-self:center;
    border:5px solid var(--green-deep);border-radius:50%;
  }
  h1{font-size:34px;font-weight:700;letter-spacing:.02em}
  .sub{font-size:24px;color:var(--ink-soft);font-weight:400}
  .live{
    margin-left:auto;display:flex;align-items:center;gap:12px;
    font-size:24px;color:var(--ink-soft);align-self:center;
  }
  .dot{width:14px;height:14px;border-radius:50%;background:var(--ok);animation:pulse 2.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .clock{font-size:26px;color:var(--ink-soft);align-self:center;font-variant-numeric:tabular-nums}

  /* ── 主区 ── */
  main{flex:1;display:grid;grid-template-columns:1fr 700px;gap:36px;min-height:0}

  .card{background:var(--card);border-radius:28px;padding:44px 48px}

  /* 战绩牌 */
  .score{display:flex;flex-direction:column}
  .score .cap{font-size:26px;color:var(--ink-soft);letter-spacing:.16em;font-weight:700}
  .today{display:flex;gap:56px;margin-top:30px}
  .stat{display:flex;flex-direction:column;gap:6px}
  .num{
    font-size:132px;line-height:.92;font-weight:700;color:var(--green-deep);
    font-variant-numeric:tabular-nums;letter-spacing:-.03em;
  }
  .num .unit{font-size:44px;font-weight:400;color:var(--ink-soft);margin-left:10px;letter-spacing:0}
  .lbl{font-size:28px;color:var(--ink-soft)}

  .rule{height:2px;background:var(--oat-deep);margin:38px 0 32px;border-radius:2px}

  .month{display:flex;align-items:flex-end;gap:52px}
  .month .cap{font-size:24px;color:var(--ink-soft);letter-spacing:.14em;font-weight:700;padding-bottom:12px}
  .mstat{display:flex;align-items:baseline;gap:12px}
  .mnum{font-size:66px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .munit{font-size:26px;color:var(--ink-soft)}

  /* ── 工位 ── */
  .desk{position:relative;display:flex;flex-direction:column;padding:36px 40px}
  .desk .cap{font-size:26px;font-weight:700;letter-spacing:.02em}
  .desk .role{font-size:22px;color:var(--ink-soft);margin-top:4px}
  .badge{
    position:absolute;top:36px;right:40px;
    font-size:21px;font-weight:700;color:#fff;background:var(--green);
    padding:9px 20px;border-radius:999px;
  }
  .scene{flex:1;display:grid;place-items:center;min-height:0}
  svg.pix{width:100%;height:auto;max-height:100%;shape-rendering:crispEdges}
  .bubble{
    background:var(--oat);border-radius:20px;padding:22px 28px;
    font-size:26px;line-height:1.45;color:var(--ink);
  }
  .bubble b{color:var(--green-deep)}
  .prog{height:12px;background:var(--oat-deep);border-radius:99px;margin-top:18px;overflow:hidden}
  .prog i{display:block;height:100%;width:37.5%;background:var(--green);border-radius:99px}

  /* ── 底部流水 ── */
  footer{margin-top:32px}
  .ticker{display:flex;gap:16px}
  .chip{
    flex:1;background:#fff;border-radius:20px;padding:20px 26px;
    display:flex;align-items:center;gap:16px;font-size:24px;
  }
  .chip .t{color:var(--ink-soft);font-variant-numeric:tabular-nums;font-size:22px}
  .chip .k{font-weight:700}
  .chip .s{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:22px}
  .sd{width:12px;height:12px;border-radius:50%}
  .s-ok .sd{background:var(--ok)} .s-ok{color:var(--ok)}
  .s-warn .sd{background:var(--warn)} .s-warn{color:var(--warn)}
  .s-run .sd{background:var(--green)} .s-run{color:var(--green)}

  .note{
    margin-top:20px;text-align:center;font-size:20px;color:var(--ink-soft);opacity:.75;
  }

  /* 打字光标 */
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  .caret{animation:blink 1.1s steps(1) infinite}
  @media (prefers-reduced-motion:reduce){
    .dot,.caret{animation:none}
  }
</style>

<div id="stage">
  <header>
    <div class="mark"></div>
    <h1>数字员工办公室</h1>
    <span class="sub">星期零 · 财务部</span>
    <div class="live"><span class="dot"></span>运行中</div>
    <div class="clock" id="clock">—</div>
  </header>

  <main>
    <!-- 战绩牌：整块屏的主角 -->
    <section class="card score">
      <div class="cap">今 日 战 绩</div>
      <div class="today">
        <div class="stat">
          <div class="num">7<span class="unit">份</span></div>
          <div class="lbl">已预审合同</div>
        </div>
        <div class="stat">
          <div class="num">23<span class="unit">条</span></div>
          <div class="lbl">标出待关注条款</div>
        </div>
        <div class="stat">
          <div class="num">2.3<span class="unit">小时</span></div>
          <div class="lbl">为法务省下</div>
        </div>
      </div>

      <div class="rule"></div>

      <div class="month">
        <div class="cap">本 月 累 计</div>
        <div class="mstat"><span class="mnum">86</span><span class="munit">份</span></div>
        <div class="mstat"><span class="mnum">271</span><span class="munit">条</span></div>
        <div class="mstat"><span class="mnum">31.5</span><span class="munit">小时</span></div>
      </div>
    </section>

    <!-- 工位特写 -->
    <section class="card desk">
      <div class="cap">合同预审员 · 财务侧</div>
      <div class="role">正在工作</div>
      <div class="badge">队列 3</div>

      <div class="scene">
        <svg class="pix" viewBox="0 0 240 150" role="img"
             aria-label="像素风工位：数字员工正在处理合同，桌上待处理文件三份">
          <!-- 墙 / 地 -->
          <rect x="0" y="0" width="240" height="112" fill="#EFEADF"/>
          <rect x="0" y="112" width="240" height="38" fill="#DED7C6"/>
          <rect x="0" y="110" width="240" height="2" fill="#CFC7B3"/>

          <!-- 墙上的小画（品牌圆环） -->
          <rect x="24" y="20" width="26" height="26" fill="#EAE4D8"/>
          <rect x="26" y="22" width="22" height="22" fill="#FFFFFF"/>
          <circle cx="37" cy="33" r="6" fill="none" stroke="#758043" stroke-width="3"/>

          <!-- 人：头 -->
          <rect x="96" y="38" width="26" height="24" fill="#E8C39E"/>
          <rect x="96" y="34" width="26" height="8" fill="#4A3B2E"/>
          <rect x="92" y="38" width="4" height="14" fill="#4A3B2E"/>
          <rect x="122" y="38" width="4" height="14" fill="#4A3B2E"/>
          <rect x="103" y="48" width="4" height="4" fill="#333"/>
          <rect x="113" y="48" width="4" height="4" fill="#333"/>
          <rect x="105" y="56" width="10" height="2" fill="#C89A76"/>
          <!-- 人：身 -->
          <rect x="88" y="62" width="42" height="30" fill="#758043"/>
          <rect x="88" y="62" width="42" height="4" fill="#8A9455"/>
          <rect x="104" y="66" width="10" height="26" fill="#66713A"/>
          <!-- 手臂伸向键盘 -->
          <rect x="78" y="74" width="12" height="20" fill="#758043"/>
          <rect x="128" y="74" width="12" height="20" fill="#758043"/>
          <rect x="76" y="92" width="14" height="8" fill="#E8C39E"/>
          <rect x="130" y="92" width="14" height="8" fill="#E8C39E"/>

          <!-- 桌面 -->
          <rect x="30" y="100" width="180" height="10" fill="#B9A98C"/>
          <rect x="30" y="100" width="180" height="3" fill="#CBBB9E"/>
          <rect x="40" y="110" width="8" height="30" fill="#A2926F"/>
          <rect x="192" y="110" width="8" height="30" fill="#A2926F"/>

          <!-- 显示器 -->
          <rect x="146" y="56" width="56" height="40" fill="#333333"/>
          <rect x="150" y="60" width="48" height="32" fill="#1F2418"/>
          <rect x="154" y="65" width="30" height="3" fill="#8A9455"/>
          <rect x="154" y="71" width="38" height="3" fill="#5C6636"/>
          <rect x="154" y="77" width="22" height="3" fill="#5C6636"/>
          <rect x="178" y="77" width="4" height="3" fill="#B7D169" class="caret"/>
          <rect x="168" y="96" width="12" height="4" fill="#555"/>

          <!-- 键盘 -->
          <rect x="86" y="96" width="52" height="5" fill="#D8D2C4"/>

          <!-- 待处理文件堆（＝队列高度） -->
          <rect x="44" y="94" width="34" height="6" fill="#FFFFFF"/>
          <rect x="44" y="94" width="34" height="1" fill="#DED7C6"/>
          <rect x="46" y="88" width="34" height="6" fill="#FDFCF8"/>
          <rect x="46" y="88" width="34" height="1" fill="#DED7C6"/>
          <rect x="44" y="82" width="34" height="6" fill="#FFFFFF"/>
          <rect x="44" y="82" width="34" height="1" fill="#DED7C6"/>
          <rect x="50" y="85" width="14" height="2" fill="#C9C2B0"/>
          <rect x="50" y="91" width="20" height="2" fill="#C9C2B0"/>

          <!-- 台灯 -->
          <rect x="206" y="72" width="4" height="28" fill="#8A8A82"/>
          <rect x="198" y="66" width="20" height="8" fill="#758043"/>
          <rect x="202" y="74" width="12" height="3" fill="#F2E9C8"/>
        </svg>
      </div>

      <div class="bubble">
        正在预审一份<b>采购合同</b>　第 3 章 / 共 8 章
        <div class="prog"><i></i></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="ticker">
      <div class="chip"><span class="t">14:22</span><span class="k">采购合同</span>
        <span class="s s-run"><span class="sd"></span>预审中</span></div>
      <div class="chip"><span class="t">13:58</span><span class="k">服务合同</span>
        <span class="s s-ok"><span class="sd"></span>已贴回审批单</span></div>
      <div class="chip"><span class="t">13:31</span><span class="k">租赁合同</span>
        <span class="s s-warn"><span class="sd"></span>扫描件 · 未预审</span></div>
      <div class="chip"><span class="t">11:47</span><span class="k">采购合同</span>
        <span class="s s-ok"><span class="sd"></span>已贴回审批单</span></div>
    </div>
    <div class="note">本屏不显示合同名称与相对方名称 · 明细需登录法务工作台查看</div>
  </footer>
</div>

<script>
  // 等比缩放：1920×1080 塞进任意屏幕
  // 用 zoom 而非 transform：zoom 会缩布局盒，父级 place-items:center 才能真正居中
  const stage = document.getElementById('stage');
  const fit = () => {
    stage.style.zoom = Math.min(1, innerWidth / 1920, innerHeight / 1080);
  };
  addEventListener('resize', fit);
  fit(); requestAnimationFrame(fit); addEventListener('load', fit);

  const clock = document.getElementById('clock');
  const tick = () => {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    const wk = '日一二三四五六'[d.getDay()];
    clock.textContent = `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} 周${wk} ${p(d.getHours())}:${p(d.getMinutes())}`;
  };
  tick(); setInterval(tick, 10000);
</script>
