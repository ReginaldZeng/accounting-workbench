<!--
[Change Log]
Date: 2026-10-13
Author: Claude Opus 5.5
Version: 样机 v0.5（未开发）
Description: 物流对账 · 付款做账总表重排样机。
  用户 2026-10-13 看付款做账总表：「感觉这个页面不太对。我们是工作台审核账单，工作台收票，付款成功，才执行自动化做账程序，但是现在付款就开始做了好像」
  → V2.934 先把「账单没复核不能做账」这道闸补上（只加了一个状态），没动页面 →「有样机吗」。
  现在的总表是 承运商 × 三个主体，每格只有 计提 / 付款 / 做账，看不出一张请款单走到了四步里的哪一步、卡在哪。
  样机改成一张请款单一行，从左到右就是那四步：① 账单复核 ② 收票 ③ 付款 ④ 做账；前一步没过，后面不做，卡在哪一步就标哪一步。
  纯静态，数据照 2026-08 的真数（2026-10-13 取）。顶部深色条可以切「收票算到哪一步」，看两种口径下各卡住几张。
  v0.2（「第一步，是不是可以按主体复核登记」「第四步，能不能放出来收款单号呢，以及制单人」）：① 整月登记复核，或这个主体标了「本主体通过」，都算过（V2.935 已做进系统）。
  v0.3（「注意字体上下居中，第二个灰色字体应该是专票已审核，普票已审核，发票后补已确认，第三个应该是放付款单号，第四个就是制单人，期间-凭证号」）：
    每格两行——上面一句结论、下面一行灰字，图标和字上下居中；灰字 ② 写票种＋审核状态（专票已审核 / 普票待审核 / 发票后补已确认），
    ③ 写金蝶付款单号，④ 写制单人 · 期间-凭证号。
  v0.4（「待审核应该是黄色？」）：② 的灰字里，还没审核通过的（待审核、草稿）标黄，已审核的还是灰色。
  v0.5（「这个绿色勾勾有点奇怪，应该别的符号」）：② 的图标分三种——审核通过才是绿勾；票收到了还没审核通过的是黄圈三个点；发票后补的是「补」。
-->

<style>

.proto .seg button[aria-pressed="true"]{background:#fff;color:#22263a;font-weight:600}
.proto .note{margin-left:auto;opacity:.75}

.wrap{max-width:1280px;margin:0 auto;padding:14px 16px 40px}

.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
.tile{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;cursor:pointer}

.tile.ok .n{color:var(--ok)} .tile.warn .n{color:var(--warn)} .tile.neu .n{color:var(--ink2)} .tile.done .n{color:var(--accent)}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 10px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--line2)}
thead th{font-size:12px;font-weight:600;color:var(--ink2);background:#FAFBFC;border-bottom:1px solid var(--line);white-space:nowrap}

let invRule = 'has', filt = '';
const money = n => n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const invOk = r => r.later ? true : r.invs.length > 0 && (invRule === 'has' || r.invs.every(i => i[1] === 'approved'));
// 这张单卡在第几步：0＝四步都过了(可以做账)，1/2/3＝卡在那一步，9＝已做账
function stage(r){
  if (r.vno) return 9;
  if (!r.rev && !r.sjok) return 1;
  if (!invOk(r)) return 2;
  if (!r.paid) return 3;
  return 0;
}
// 灰字：票种＋审核状态，如「专票已审核」「专票 2 张待审核」「专票已审核、普票待审核」
function invText(r){
  const by = {};
  for (const [t, st] of r.invs) by[t + '|' + st] = (by[t + '|' + st] || 0) + 1;
  return Object.entries(by).map(([k, n]) => { const [t, st] = k.split('|'); const x = t + (n > 1 ? ` ${n} 张` : '') + REV_CN[st];
    return st === 'approved' ? x : `<span class="w">${x}</span>`; }).join('、');      // 还没审核通过的标黄
}
function cell(kind, ic, main, grey, title){
  return `<div class="c ${kind}"${title ? ` title="${title}"` : ''}><span class="ic">${ic}</span><span class="tx"><span class="m">${main}</span>${grey ? `<span class="g">${grey}</span>` : ''}</span></div>`;
}
function render(){
  const rows = D.map(r => ({...r, st:stage(r)}));
  const cnt = k => rows.filter(r => r.st === k);
  const late = r => !!r.vno && !r.sjok && !!r.rev && r.at < r.rev;      // 先做的账、后来才整月登记
  const skipped = rows.filter(r => r.vno && ((!r.rev && !r.sjok) || late(r) || (invRule==='approved' && !r.later && !r.invs.every(i => i[1]==='approved'))));
  const T = [
    ['0','ok','可以做账','四步都过了', cnt(0)],
    ['1','warn','卡在 ① 账单复核','整月没登记，这个主体也没标通过', cnt(1)],
    ['2','warn','卡在 ② 收票', invRule==='has'?'票夹里没票':'没票，或发票管家还没审核通过', cnt(2)],
    ['3','neu','等 ③ 付款','账单、票都好了，金蝶还没有付款单', cnt(3)],
    ['9','done','已做账', skipped.length ? `其中 ${skipped.length} 张当时没按这四步的顺序做` : '', cnt(9)],
  ];
  document.getElementById('tiles').innerHTML = T.map(t =>
    `<button class="tile ${t[1]}" data-k="${t[0]}" aria-pressed="${filt===t[0]}"><div class="n">${t[4].length}</div><div class="t">${t[2]}</div><div class="s">${t[3]}</div></button>`).join('');
  const show = rows.filter(r => filt === '' || String(r.st) === filt);
  const groups = [...new Set(show.map(r => r.ca))];
  let h = '';
  for (const g of groups){
    const rs = show.filter(r => r.ca === g);
    h += `<tr class="grp"><td colspan="7">${g}<span class="cnt">${rs.length} 张请款单 · ${money(rs.reduce((a,r)=>a+r.amt,0))}</span></td></tr>`;
    for (const r of rs){
      const s = r.st, done = s === 9;
      const at = n => !done && s === n;                 // 卡在这一步
      const after = n => !done && s !== 0 && s < n;     // 前面有没过的，这一步先不看
      // ① 账单复核
      const c1 = r.rev ? cell('ok','✓','已复核', `整月登记 ${r.rev}` + (late(r) ? ' · 做账以后才登记的' : ''))
        : r.sjok ? cell('ok','✓','已复核', `本主体通过 ${r.sjok}`)
        : (done ? cell('stop','!','没复核','做账时就没复核') : cell('stop','!','还没复核','<button class="lnk">去账单复核台</button>'));
      // ② 收票：灰字＝票种＋审核状态
      let c2;
      if (r.later) c2 = cell('later','补','票后到','发票后补已确认');
      else if (!r.invs.length) c2 = after(2) ? cell('wait','○','没票') : cell('stop','!','没票','<button class="lnk">去发票管家</button>');
      else {
        const main = `已收 ${r.invs.length} 张`, grey = invText(r);
        const allOk = r.invs.every(i => i[1] === 'approved');
        c2 = invOk(r) ? (allOk ? cell('ok','✓',main,grey) : cell('pend','<i></i><i></i><i></i>',main,grey)) : (after(2) ? cell('wait','○',main,grey) : cell('stop','!',main, grey + (done ? '' : ' · <button class="lnk">去审核</button>')));
      }
      // ③ 付款：灰字＝金蝶付款单号
      const fkd = r.fkd ? `<span class="mono">${r.fkd}</span>` : '付款单还是暂存，没编号';
      const c3 = r.paid ? cell('ok','✓','已付款', fkd, `付款日期 ${r.paid}`) : (after(3) ? cell('wait','○','没付款') : cell(at(3)?'stop':'wait', at(3)?'⋯':'○','等付款','金蝶还没有付款单'));
      // ④ 做账：灰字＝制单人 · 期间-凭证号
      let c4, act = '';
      if (done){
        const who = r.by === '系统自动' ? '系统自动做的' : `工作台里 ${r.by} 点的`;
        c4 = cell('ok','✓',`已做账<span class="tag ${r.vst==='C'?'ok':'warn'}">${r.vst==='C'?'已审核':'等审核'}</span>`,
                  `${r.maker} · <span class="mono">${r.per} ${r.vno}</span>`, `${who}，${r.at}`);
        act = '<button class="btn">查看</button>';
      }
      else if (s === 0){ c4 = cell('go','→','可以做账','自动做账下一轮会做'); act = '<button class="btn pri">凭证预览</button>'; }
      else { c4 = cell('wait','○','还不能做',`卡在 ${'①②③'[s-1]}`); act = '<button class="btn">凭证预览</button>'; }
      const sc = n => (at(n) ? ' class="stopcell"' : '');
      h += `<tr><td>${r.sj}</td><td class="num mono">${money(r.amt)}</td><td${sc(1)}>${c1}</td><td${sc(2)}>${c2}</td><td${sc(3)}>${c3}</td><td>${c4}</td><td>${act}</td></tr>`;
    }
  }
  document.getElementById('tb').innerHTML = h || '<tr><td colspan="7" class="dim" style="padding:22px;text-align:center">这一类现在没有</td></tr>';
  document.getElementById('foot').innerHTML =
    '每格两行：上面是结论，下面灰字是依据——① 整月登记还是本主体通过、哪天；② 票种和发票管家的审核状态；③ 金蝶付款单号（鼠标停一下看付款日期）；④ 制单人 · 期间 凭证号（鼠标停一下看工作台里是谁点的）。<br>' +
    '和现在的页面比：现在一格里只有 计提 / 付款 / 做账，看不到账单复核、收票走到哪了；金蝶没出付款单的现在不显示，这里也列出来；计提金额、红冲更正这些细节收进「凭证预览」。<br>' +
    '④ 的制单人是金蝶凭证上的：系统审核付款单、金蝶自动出的凭证，制单人都是「系统操作员」。标了「做账时就没复核」「做账以后才登记的」的，是 V2.934 之前没有这道闸时做的。';
}
document.getElementById('segInv').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  invRule = b.dataset.v;
  document.querySelectorAll('#segInv button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  render();
});
document.getElementById('tiles').addEventListener('click', e => {
  const b = e.target.closest('.tile'); if (!b) return;
  filt = filt === b.dataset.k ? '' : b.dataset.k;
  render();
});
render();
</script>
</body>
</html>
