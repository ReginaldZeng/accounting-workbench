<!doctype html>
<!--
[Change Log]
Date: 2026-10-13
Author: Claude Opus 5.5
Version: 样机 v0.1（未开发）
Description: 物流对账 · 付款做账总表重排样机。
  用户 2026-10-13 看付款做账总表：「感觉这个页面不太对。我们是工作台审核账单，工作台收票，付款成功，才执行自动化做账程序，但是现在付款就开始做了好像」
  → V2.934 先把「账单没复核不能做账」这道闸补上（只加了一个状态），没动页面 →「有样机吗」。
  现在的总表是 承运商 × 三个主体，每格只有 计提 / 付款 / 做账，看不出一张请款单走到了四步里的哪一步、卡在哪。
  样机改成一张请款单一行，从左到右就是那四步：① 账单复核 ② 收票 ③ 付款 ④ 做账；前一步没过，后面不做，卡在哪一步就标哪一步。
  纯静态，数据照 2026-08 的真数（2026-10-13 取）。顶部深色条可以切「收票算到哪一步」，看两种口径下各卡住几张。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>付款做账四步 · 样机</title>
<style>
:root{
  --bg:#F5F7F8; --card:#fff; --line:#DCE2E7; --line2:#EDF0F2;
  --ink:#1F2A33; --ink2:#5E6B78; --ink3:#8A96A2;
  --accent:#1F6E8C; --accent-bg:#E6F1F5;
  --ok:#2E7D57; --ok-bg:#DCEFE4; --warn:#B06A12; --warn-bg:#F7E9CF; --bad:#B23B2E; --bad-bg:#F8DDD8; --neu-bg:#E7ECEF;
  --mono:Consolas,Menlo,"Cascadia Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:13px/1.55 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dim{color:var(--ink3)}

.proto{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 16px;background:#22263a;color:#cfd3e6;font-size:12px}
.proto b{color:#fff;font-weight:600}
.proto .seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:3px;border-radius:9px;background:rgba(255,255,255,.08)}
.proto .seg button{border:0;border-radius:6px;padding:4px 11px;background:transparent;color:#cfd3e6;cursor:pointer}
.proto .seg button[aria-pressed="true"]{background:#fff;color:#22263a;font-weight:600}
.proto .note{margin-left:auto;opacity:.75}

.wrap{max-width:1280px;margin:0 auto;padding:14px 16px 40px}
.head{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
.head h1{font-size:17px;margin:0}.head .sub{font-size:12px;color:var(--ink3)}
.rule{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:6px 0 14px;font-size:12.5px;color:var(--ink2)}
.rule .st{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.rule .st i{font-style:normal;font-weight:700;color:var(--accent)}
.rule .ar{color:var(--ink3)}

.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
.tile{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;cursor:pointer}
.tile[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
.tile .n{font-size:22px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.tile .t{font-size:12.5px;color:var(--ink2)}
.tile .s{font-size:11.5px;color:var(--ink3);margin-top:2px;min-height:17px}
.tile.ok .n{color:var(--ok)} .tile.warn .n{color:var(--warn)} .tile.neu .n{color:var(--ink2)} .tile.done .n{color:var(--accent)}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line2)}
thead th{font-size:12px;font-weight:600;color:var(--ink2);background:#FAFBFC;border-bottom:1px solid var(--line);white-space:nowrap}
thead th .no{display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;border-radius:50%;background:var(--accent-bg);color:var(--accent);font-weight:700;margin-right:5px;font-size:11.5px}
tr.grp td{background:#F3F6F8;font-weight:600;padding:6px 10px;border-bottom:1px solid var(--line)}
tr.grp .cnt{font-weight:400;color:var(--ink3);margin-left:8px;font-size:12px}
td.num{text-align:right;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
.c{display:flex;gap:7px;align-items:flex-start}
.c .ic{flex:none;width:18px;height:18px;line-height:18px;border-radius:50%;text-align:center;font-size:11.5px;font-weight:700;margin-top:1px}
.c .tx{min-width:0}
.c .tx small{display:block;color:var(--ink3);font-size:11.5px}
.c.ok .ic{background:var(--ok-bg);color:var(--ok)}
.c.stop .ic{background:var(--warn-bg);color:var(--warn)} .c.stop .tx b{color:var(--warn)}
.c.wait .ic{background:var(--neu-bg);color:var(--ink3)} .c.wait .tx{color:var(--ink3)}
.c.go .ic{background:var(--ok);color:#fff}
td.stopcell{background:#FFFAF0}
.tag{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11.5px;white-space:nowrap}
.tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.done{background:var(--accent-bg);color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 11px;cursor:pointer;font-size:12px;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.lnk{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:12px}
.foot{margin-top:12px;font-size:12px;color:var(--ink3);line-height:1.8}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))} .card{overflow-x:auto} table{min-width:900px}}
</style>
</head>
<body>
<div class="proto">
  <b>样机</b>
  <span>收票算到哪一步</span>
  <span class="seg" id="segInv">
    <button data-v="has" aria-pressed="true">票夹里有票、金额等于请款就算（现在）</button>
    <button data-v="approved" aria-pressed="false">发票管家审核通过才算</button>
  </span>
  <span class="note">数据是 2026-08 的真数（10-13 取），按钮点了不会真做</span>
</div>

<div class="wrap">
  <div class="head"><h1>付款做账</h1><span class="sub">物流请款单 · 账期 2026-08</span></div>
  <div class="rule">
    <span class="st"><i>①</i>账单复核</span><span class="ar">→</span>
    <span class="st"><i>②</i>收票</span><span class="ar">→</span>
    <span class="st"><i>③</i>付款</span><span class="ar">→</span>
    <span class="st"><i>④</i>做账</span>
    <span>前一步没过，后面不做。卡在哪一步，那一格标黄。</span>
  </div>

  <div class="tiles" id="tiles"></div>

  <div class="card">
    <table>
      <thead><tr>
        <th style="width:150px">主体</th><th style="width:110px;text-align:right">请款金额</th>
        <th><span class="no">1</span>账单复核</th><th><span class="no">2</span>收票</th><th><span class="no">3</span>付款</th><th><span class="no">4</span>做账</th>
        <th style="width:96px"></th>
      </tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
  <div class="foot" id="foot"></div>
</div>

<script>
// 2026-08 真数(10-13 取)：rev＝复核台登记复核的日期('' 没登记)；inv＝[张数, 发票管家状态 approved/pending/draft]，null 没票，'later' 发票后补；
// paid＝金蝶有没有付款单；vno＝工作台做的凭证号('' 还没做)；by＝谁做的。
const D = [
  ['极鲜达','孝感星期九',99860.00,'',[2,'approved'],false,'',''],
  ['极鲜达','深圳星期零',75093.68,'',[1,'draft'],false,'',''],
  ['极鲜达','深圳星期九',5628.85,'',[1,'pending'],true,'记-1','系统自动'],
  ['恒茂','孝感星期九',78733.53,'10-13',[1,'pending'],false,'',''],
  ['天鹰','孝感星期九',42441.29,'',null,false,'',''],
  ['天鹰','深圳星期零',12437.18,'',null,false,'',''],
  ['迅鸽','深圳星期零',29746.39,'',[1,'pending'],true,'',''],
  ['迅鸽','孝感星期九',3151.50,'',[1,'approved'],true,'',''],
  ['迅鸽','孝感星期九',744.00,'',[1,'pending'],true,'记-12','系统自动'],
  ['迅鸽','深圳星期零',309.24,'',[1,'draft'],true,'记-4','系统自动'],
  ['链盟','孝感星期九',446295.00,'10-09',[2,'pending'],true,'记-193','系统自动'],
  ['链盟','深圳星期零',19820.00,'10-09',[1,'pending'],true,'记-355','系统自动'],
  ['链盟','深圳星期九',7100.00,'10-09',[1,'draft'],true,'记-13','系统自动'],
  ['易风达','孝感星期九',87168.00,'10-06',[4,'draft'],true,'记-264','曾禹锡',true],
  ['易风达','深圳星期零',800.00,'10-06',[1,'pending'],true,'记-357','曾禹锡'],
  ['顺丰冷运','深圳星期零',17630.95,'10-04',[1,'pending'],true,'记-330','曾禹锡'],
  ['顺丰冷运','深圳星期九',622.00,'10-04',[1,'pending'],true,'记-14','系统自动'],
  ['丰源','深圳星期零',4117.46,'',[1,'pending'],true,'记-360','系统自动'],
  ['丰源','孝感星期九',2288.00,'',[1,'pending'],true,'记-158','系统自动'],
  ['丰源','深圳星期九',918.93,'',[1,'pending'],true,'记-12','曾禹锡'],
  ['跨越','深圳星期零',2675.03,'10-05',[1,'pending'],true,'记-261','曾禹锡',true],
  ['跨越','孝感星期九',644.15,'10-05',[1,'pending'],true,'记-475','系统自动'],
  ['中通快运','深圳星期零',1555.70,'',[1,'pending'],true,'记-358','曾禹锡'],
  ['禾享','深圳星期零',1322.00,'10-06','later',true,'记-391','曾禹锡'],
  ['路凯','深圳星期零',1002.09,'',[1,'draft'],true,'记-399','系统自动'],
  ['顺丰速运','深圳星期零',960.00,'10-08',[1,'draft'],true,'记-260','曾禹锡',true],
].map(a => ({ca:a[0],sj:a[1],amt:a[2],rev:a[3],inv:a[4],paid:a[5],vno:a[6],by:a[7],late:!!a[8]}));
const INV_CN = {approved:'已审核通过', pending:'待审核', draft:'草稿（还没提交）'};
let invRule = 'has', filt = '';
const money = n => n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const invOk = r => r.inv === 'later' ? true : !!r.inv && (invRule === 'has' || r.inv[1] === 'approved');
// 这张单卡在第几步：0＝四步都过了(可以做账)，1/2/3＝卡在那一步，9＝已做账
function stage(r){
  if (r.vno) return 9;
  if (!r.rev) return 1;
  if (!invOk(r)) return 2;
  if (!r.paid) return 3;
  return 0;
}
function cell(kind, ic, main, sub){
  return `<div class="c ${kind}"><span class="ic">${ic}</span><span class="tx">${kind==='stop'?'<b>'+main+'</b>':main}${sub?'<small>'+sub+'</small>':''}</span></div>`;
}
function render(){
  const rows = D.map(r => ({...r, st:stage(r)}));
  const cnt = k => rows.filter(r => r.st === k);
  const skipped = rows.filter(r => r.vno && (!r.rev || r.late || (invRule==='approved' && r.inv!=='later' && r.inv && r.inv[1]!=='approved')));
  const T = [
    ['0','ok','可以做账','四步都过了', cnt(0)],
    ['1','warn','卡在 ① 账单复核','账单还没在复核台登记复核', cnt(1)],
    ['2','warn','卡在 ② 收票', invRule==='has'?'票夹里没票':'没票，或发票管家还没审核通过', cnt(2)],
    ['3','neu','等 ③ 付款','账单、票都好了，金蝶还没有付款单', cnt(3)],
    ['9','done','已做账', skipped.length ? `其中 ${skipped.length} 张当时没按这四步的顺序做` : '', cnt(9)],
  ];
  document.getElementById('tiles').innerHTML = T.map(t =>
    `<button class="tile ${t[1]}" data-k="${t[0]}" aria-pressed="${filt===t[0]}"><div class="n">${t[4].length}</div><div class="t">${t[2]}</div><div class="s">${t[3]}</div></button>`).join('');
  const show = rows.filter(r => filt === '' || String(r.st) === filt);
  const groups = [...new Set(show.map(r => r.ca))];
  let h = '';
  for (const g of groups){
    const rs = show.filter(r => r.ca === g);
    h += `<tr class="grp"><td colspan="7">${g}<span class="cnt">${rs.length} 张请款单 · ${money(rs.reduce((a,r)=>a+r.amt,0))}</span></td></tr>`;
    for (const r of rs){
      const s = r.st, done = s === 9;
      const at = n => !done && s === n;                 // 卡在这一步
      const after = n => !done && s !== 0 && s < n;     // 前面有没过的，这一步先不看
      // ① 账单复核
      const c1 = r.rev ? cell('ok','✓','已登记复核', r.rev + (r.late?' · 是做账以后才登记的':'')) : (done ? cell('stop','!','没登记复核','做账时就没复核') : cell('stop','!','还没复核','<button class="lnk">去账单复核台</button>'));
      // ② 收票
      let c2;
      if (r.inv === 'later') c2 = cell('ok','✓','发票后补','已登记后补单，先付款、票到了再转待认证');
      else if (!r.inv) c2 = after(2) ? cell('wait','○','没票') : cell('stop','!','没票','<button class="lnk">去发票管家</button>');
      else {
        const txt = `${r.inv[0]} 张 · ${INV_CN[r.inv[1]]}`;
        const good = invRule === 'has' || r.inv[1] === 'approved';
        c2 = good ? cell('ok','✓',txt) : (after(2) ? cell('wait','○',txt) : cell('stop','!',txt, done ? '做账时还没审核通过' : '<button class="lnk">去发票管家审核</button>'));
      }
      // ③ 付款
      const c3 = r.paid ? cell('ok','✓','已付款','金蝶有付款单') : (after(3) ? cell('wait','○','没付款') : cell(at(3)?'stop':'wait', at(3)?'…':'○','等付款','金蝶还没有付款单'));
      // ④ 做账
      let c4, act = '';
      if (done){ c4 = cell('ok','✓',`已做账 ${r.vno}`, r.by); act = '<button class="btn">查看</button>'; }
      else if (s === 0){ c4 = cell('go','→','可以做账','自动做账下一轮会做'); act = '<button class="btn pri">凭证预览</button>'; }
      else { c4 = cell('wait','○','还不能做',`卡在 ${'①②③'[s-1]}`); act = '<button class="btn">凭证预览</button>'; }
      const sc = n => (at(n) ? ' class="stopcell"' : '');
      h += `<tr><td>${r.sj}</td><td class="num mono">${money(r.amt)}</td><td${sc(1)}>${c1}</td><td${sc(2)}>${c2}</td><td${sc(3)}>${c3}</td><td>${c4}</td><td>${act}</td></tr>`;
    }
  }
  document.getElementById('tb').innerHTML = h || '<tr><td colspan="7" class="dim" style="padding:22px;text-align:center">这一类现在没有</td></tr>';
  document.getElementById('foot').innerHTML =
    '和现在的页面比：① 现在一格里只有 计提 / 付款 / 做账，看不到账单复核、收票走到哪了；② 现在金蝶没出付款单的不显示，这里也列出来（账单、票可以先办）；' +
    '③ 计提金额、红冲更正这些做账细节收进「凭证预览」，总表只回答「走到哪一步、卡在哪」。<br>' +
    '已做账里标了「做账时就没复核」「是做账以后才登记的」的，是 V2.934 之前没有这道闸时做的。';
}
document.getElementById('segInv').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  invRule = b.dataset.v;
  document.querySelectorAll('#segInv button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  render();
});
document.getElementById('tiles').addEventListener('click', e => {
  const b = e.target.closest('.tile'); if (!b) return;
  filt = filt === b.dataset.k ? '' : b.dataset.k;
  render();
});
render();
</script>
</body>
</html>
