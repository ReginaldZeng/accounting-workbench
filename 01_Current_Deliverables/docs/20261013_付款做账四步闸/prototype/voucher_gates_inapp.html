<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>付款做账 · 接进工作台的样子 · 样机</title>
<style>
:root{
  --bg:#ffffff; --card:#fff; --line:#e9ebef; --line2:#eef0f3; --sub:#fafbfc; --rail:#f6f7f9; --line-strong:#dcdfe5;
  --ink:#181b21; --ink2:#5a616d; --ink3:#9298a4;
  --accent:#4b53c4; --accent-bg:#edeefb;
  --ok:#1f7a55; --ok-bg:#e8f4ee; --warn:#a35a00; --warn-bg:#f8f0e0; --warn-line:#e6cfa6; --bad:#c0392b; --bad-bg:#fbecea; --neu-bg:#eef0f3; --gray:#6b7280;
  --mono:ui-monospace,"Cascadia Code",SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:13px/1.5 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dim{color:var(--ink3)}

.proto{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 16px;background:#22263a;color:#cfd3e6;font-size:12px}
.proto b{color:#fff;font-weight:600}
.proto .seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:3px;border-radius:9px;background:rgba(255,255,255,.08)}
.proto .seg button{border:0;border-radius:6px;padding:4px 11px;background:transparent;color:#cfd3e6;cursor:pointer}
.proto .seg button[aria-pressed="true"]{background:#fff;color:#22263a;font-weight:600}
.proto .note{margin-left:auto;opacity:.75}

.shell{display:flex;min-height:calc(100vh - 37px)}
.rail{flex:none;width:72px;background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0}
.rail .logo{width:38px;height:38px;border-radius:11px;background:var(--accent);margin-bottom:8px;display:flex;align-items:center;justify-content:center}
.rail .it{width:44px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--ink3)}
.rail .it.on{background:var(--accent-bg);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.rail svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rail .logo svg{stroke:#fff}
.rail .sp{flex:1}
.rail .me{width:30px;height:30px;border-radius:50%;background:var(--accent-bg);color:var(--accent);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
main{flex:1;min-width:0}
.wrap{padding:14px 22px 40px}
.crumb{font-size:12px;color:var(--ink3);margin-bottom:2px}
.auto{border:1px solid var(--warn-line);border-radius:9px;background:var(--warn-bg);padding:8px 12px;font-size:12.5px;display:flex;flex-direction:column;gap:6px;margin:10px 0 14px}
.auto .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.auto .row.sub{color:var(--ink2)}
.auto .row.nt{border-top:1px dashed var(--line-strong);padding-top:7px;margin-top:1px}
.auto .segm{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--bg)}
.auto .segm span{font-size:12.5px;padding:4px 12px;color:var(--ink2);border-right:1px solid var(--line-strong)}
.auto .segm span:last-child{border-right:0}
.auto .segm span.on{font-weight:700;color:#fff;background:var(--warn)}
.auto .ck{display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.auto .who{display:inline-block;border:1px solid var(--line-strong);background:var(--bg);border-radius:999px;padding:1px 9px;font-size:12px}
.auto .ok{color:var(--ok);font-weight:600} .auto .wn{color:var(--warn);font-weight:600}
.bar .sp{flex:1}
td.ck,th.ck{width:30px;padding-right:0}
.head{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
.head h1{font-size:17px;margin:0}.head .sub{font-size:12px;color:var(--ink3)}
.rule{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:6px 0 14px;font-size:12.5px;color:var(--ink2)}
.rule .st{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.rule .st i{font-style:normal;font-weight:700;color:var(--accent)}
.rule .ar{color:var(--ink3)}

.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
.tile{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;cursor:pointer}
.tile[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
.tile .n{font-size:22px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.tile .t{font-size:12.5px;color:var(--ink2)}
.tile .s{font-size:11.5px;color:var(--ink3);margin-top:2px;min-height:17px}
.tile.ok .n{color:var(--ok)} .tile.warn .n{color:var(--warn)} .tile.neu .n{color:var(--ink2)} .tile.done .n{color:var(--accent)}

.bar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar .q{position:relative;flex:0 1 380px}
.bar .q input{width:100%;height:34px;padding:0 30px 0 32px;border:1px solid var(--line);border-radius:8px;background:var(--card);font:inherit;color:var(--ink);outline:none}
.bar .q input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
.bar .q input::-webkit-search-cancel-button{display:none}
.bar .q svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--ink3);fill:none;stroke-width:2;stroke-linecap:round}
.bar .q .x{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--ink3);cursor:pointer;font-size:15px;line-height:1;padding:4px;display:none}
.bar .q.has .x{display:block}
.bar .n{font-size:12px;color:var(--ink3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 8px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--line2)}
thead th{font-size:11.5px;font-weight:600;color:var(--ink3);background:var(--sub);border-bottom:1px solid var(--line);white-space:nowrap}
thead th .hd{display:inline-flex;align-items:center;gap:6px}
thead th .no{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--accent-bg);color:var(--accent);font-weight:700;font-size:11.5px;line-height:1}
tr.grp td{background:var(--rail);font-weight:600;padding:6px 10px;border-bottom:1px solid var(--line)}
tr.grp .gh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
tr.grp .code{font-weight:400;color:var(--ink2);font-size:12px}
tr.grp .short{font-weight:400;font-size:12px;color:var(--accent);background:var(--accent-bg);border-radius:999px;padding:0 8px;line-height:18px}
tr.grp .cnt{font-weight:400;color:var(--ink3);margin-left:auto;font-size:12px}
td.num{text-align:right;white-space:nowrap}
tbody td:nth-child(2){white-space:nowrap}
td.acc .a{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:1px;min-height:36px}
td.acc .a .g{color:var(--ink3);font-size:11.5px;line-height:1.4;white-space:nowrap;font-family:inherit}
td.acc .a .g .w{color:var(--warn);font-weight:600}
tbody tr:last-child td{border-bottom:0}
/* 每格：图标 + 两行字(上面结论、下面灰字)，图标和这两行字整体上下居中 */
.c{display:flex;gap:8px;align-items:center;min-height:36px}
.c .ic{flex:none;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-size:12px;font-weight:700;line-height:1}
.c .tx{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1px}
.c .tx .m{display:flex;align-items:center;gap:6px;line-height:1.4;white-space:nowrap}
.c .tx .g{color:var(--ink3);font-size:11.5px;line-height:1.4;white-space:nowrap}
.c .tx .g .w{color:var(--warn);font-weight:600}
.c.ok .ic{background:var(--ok-bg);color:var(--ok)}
.c.stop .ic{background:var(--warn-bg);color:var(--warn)} .c.stop .tx .m{color:var(--warn);font-weight:600}
.c.wait .ic{background:var(--neu-bg);color:var(--ink3)} .c.wait .tx .m{color:var(--ink3)}
.c.go .ic{background:var(--ok);color:#fff} .c.go .tx .m{font-weight:600;color:var(--ok)}
/* 票收到了、还没审核通过：黄圈三个点(不是办完了的绿勾，也不是卡住的实心黄叹号) */
.c.pend .ic{background:#fff;box-shadow:inset 0 0 0 1.5px var(--warn);gap:2px}
.c.pend .ic i{width:3px;height:3px;border-radius:50%;background:var(--warn)}
.c.later .ic{background:var(--accent-bg);color:var(--accent);font-size:11px}
td.stopcell{background:#fdf8ee}
.tag{display:inline-flex;align-items:center;padding:0 7px;height:18px;border-radius:999px;font-size:11.5px;font-weight:400;white-space:nowrap}
.tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.ok{background:var(--ok-bg);color:var(--ok)}
.btn{border:1px solid var(--line-strong);background:var(--card);border-radius:8px;height:28px;padding:0 11px;cursor:pointer;font-size:12px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center}
.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.lnk{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:11.5px;line-height:1.4}
.foot{margin-top:12px;font-size:12px;color:var(--ink3);line-height:1.8}
.mask{position:fixed;inset:0;z-index:20;background:rgba(20,28,36,.45);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto}
.mask.on{display:flex}
.dlg{width:min(640px,100%);background:var(--card);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.25);overflow:hidden}
.dlg .dh{padding:14px 18px 12px;border-bottom:1px solid var(--line2)}
.dlg .dh .t1{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dlg .dh .t2{font-size:12px;color:var(--ink2);margin-top:3px}
.dlg .dh .pill{display:inline-flex;align-items:center;height:20px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600}
.pill.done{background:var(--accent-bg);color:var(--accent)} .pill.go{background:var(--ok-bg);color:var(--ok)} .pill.stop{background:var(--warn-bg);color:var(--warn)}
.dlg .db{padding:14px 18px 6px;max-height:62vh;overflow:auto}
.dlg .df{display:flex;align-items:center;gap:8px;padding:10px 18px 14px}
.dlg .df .sp{flex:1}
.sec{font-size:11.5px;color:var(--ink3);margin:2px 0 8px;letter-spacing:.02em}
.sec.s2{margin-top:14px}
ol.steps{list-style:none;margin:0;padding:0}
ol.steps li{position:relative;display:flex;gap:12px;padding:0 0 14px 0;opacity:.28;transition:opacity .35s ease}
ol.steps li::before{content:'';position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--line);transition:background .35s ease}
ol.steps li:last-child::before{display:none}
ol.steps li .dot{flex:none;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;line-height:1;
  background:#fff;color:var(--ink3);box-shadow:inset 0 0 0 1.5px var(--line);transition:all .3s ease;z-index:1}
ol.steps li .bx{min-width:0;padding-top:2px}
ol.steps li .bx b{display:block;font-weight:600;line-height:1.4}
ol.steps li .bx span{display:block;color:var(--ink2);font-size:12px;line-height:1.55}
ol.steps li.on{opacity:1}
ol.steps li.on.done .dot{background:var(--ok);color:#fff;box-shadow:none} ol.steps li.on.done::before{background:var(--ok)}
ol.steps li.on.plan .dot{background:var(--accent-bg);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
ol.steps li.on.bad .dot{background:var(--warn);color:#fff;box-shadow:none} ol.steps li.on.bad .bx b{color:var(--warn)}
ol.steps li.on.skip .dot{background:var(--neu-bg);color:var(--ink3);box-shadow:none}
ol.steps li.run .dot{animation:pulse .5s ease-out 1}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(75,83,196,.45)}50%{box-shadow:0 0 0 6px rgba(75,83,196,0)}}
@media (prefers-reduced-motion: reduce){ol.steps li,ol.steps li .dot,ol.steps li::before{transition:none} ol.steps li.run .dot{animation:none}}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))} .card{overflow-x:auto} table{min-width:960px}}
</style>
</head>
<body>
<div class="proto">
  <b>样机</b>
  <span>收票算到哪一步</span>
  <span class="seg" id="segInv">
    <button data-v="has" aria-pressed="true">票夹里有票、金额等于请款就算（现在）</button>
    <button data-v="approved" aria-pressed="false">发票管家审核通过才算</button>
  </span>
  <span class="note">数据是 2026-08 的真数（10-13 取），按钮点了不会真做</span>

<div class="shell">
<aside class="rail" aria-label="工作台导航（示意）">
  <div class="logo"><svg viewBox="0 0 24 24"><path d="M4 10l8-5 8 5M6 10v8M10 10v8M14 10v8M18 10v8M4 19h16"/></svg></div>
  <div class="it"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 10v9h12v-9"/></svg></div>
  <div class="it"><svg viewBox="0 0 24 24"><path d="M4 10l8-5 8 5M6 10v8M12 10v8M18 10v8M4 19h16"/></svg></div>
  <div class="it on" title="应付板块 › 物流对账"><svg viewBox="0 0 24 24"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="1.6"/><circle cx="17.5" cy="18" r="1.6"/></svg></div>
  <div class="it"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg></div>
  <div class="it"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg></div>
  <span class="sp"></span><div class="me">锡</div>
</aside>
<main>
<div class="wrap">
  <div class="crumb">应付板块 › 物流对账</div>
  <div class="head"><h1>付款做账</h1><span class="sub">物流请款单 · 账期 2026-08</span></div>
  <div class="auto" aria-label="自动做账（现有的，原样保留）">
    <div class="row"><b>自动做账</b><span class="segm"><span>关</span><span class="on">演练</span><span>真做</span></span>
      <span class="dim">范围</span>
      <label class="ck"><input type="checkbox" checked disabled>一致·只核销</label><label class="ck"><input type="checkbox" checked disabled>尾差·红冲更正</label>
      <label class="ck"><input type="checkbox" checked disabled>需红冲更正</label><label class="ck"><input type="checkbox" checked disabled>发票后补·先付款</label>
      <button class="lnk">单笔上限 不限</button><button class="lnk">每轮最多 10 张</button><span style="flex:1"></span><button class="btn">现在演练一轮</button></div>
    <div class="row sub"><span>上一轮（演练 · 定时）：如果开着<span class="ok">会做 <span id="aYes">0</span> 张</span>，<span class="wn">不做 <span id="aNo">0</span> 张</span>　<button class="lnk">看是哪几张、为什么</button></span>

<script>
// 2026-08 真数(10-13 取)：rev＝整月登记复核的日期；sjok＝这个主体在复核台第①步标「本主体通过」的日期和人；
// invs＝票夹里的票 [[票种, 发票管家状态 approved/pending/draft]…]；later＝确认过发票后补；
// paid＝金蝶付款单日期；fkd＝金蝶付款单号(空＝付款单还是暂存、没编号)；vno/at/by＝工作台做的凭证号、哪天、谁点的；

    else A.push({t:`红冲更正 ${a.ref}`, d: a.why + (a.old !== a.new ? `。含税 ${money(a.old)} → ${money(a.new)}` : a.oldtax !== a.newtax ? `。税额 ${money(a.oldtax)} → ${money(a.newtax)}` : '') + '。原计提整笔红冲，再按对的重提'});
  }
  if (r.later) A.push({skip:1, t:'核销', d:'发票后补：这一步先不做，暂估进项税挂着；票到了另做一张「暂估转待认证」'});
  else if (r.tax06 > 0) A.push({t:'核销，暂估转待认证', d:`按 ${r.ninv} 张发票，暂估进项税 ${money(r.tax06)} 转到待认证`});
  else A.push({skip:1, t:'核销', d: r.ninv ? '发票不能抵扣，不转待认证' : '没有暂估进项税要转'});
  A.push({t:'提交凭证', d: done ? (r.vst === 'C' ? '已提交，已经审核了' : '已提交，等人在金蝶审核') : '提交，不审核；审核留给人在金蝶做'});
  A.push(r.cf.length ? {t:'指定现金流量', d: r.cf.map(x => `${x[0]} ${money(x[1])}`).join(' ＋ ')} : {bad:1, t:'指定现金流量', d: (r.cfwhy || '拆不出来') + '：系统不猜，要人到金蝶指定'});
  for (const x of r.xbook) A.push({t:`${x.short}账上红冲 ${x.ref}`, d: x.done ? `${x.short}那边已经红冲过了（${money(x.gross)}），不重复做`
    : x.via ? `放在${x.short}自己的付款凭证里一起做` : `到${x.short}账簿建红冲凭证 ${money(x.gross)}，提交不审核`});
  A.push({t:'收尾', d:'记做账记录；首页待办转给审核人；发钉钉提醒'});
  return {G, A, done, st};
}
let timers = [], cur = null;
function play(){
  timers.forEach(clearTimeout); timers = [];
  const {G, A, done, st} = stepsOf(cur);
  const blocked = !done && st >= 1 && st <= 3, manual = !done && cur.plan === 'manual';
  const li = (x, cls, n) => `<li class="${cls}"><span class="dot">${n}</span><div class="bx"><b>${x.t}</b><span>${x.d}</span></div></li>`;
  document.getElementById('dB').innerHTML =
    `<div class="sec">先过三道闸</div><ol class="steps" id="sG">` + G.map(x => li(x, x.ok ? 'done' : 'bad', x.ok ? '✓' : '!')).join('') + `</ol>` +
    `<div class="sec s2">${done ? '系统当时是这样做的' : manual ? '然后' : blocked ? '过了以后，系统会这样做' : '系统下一轮会这样做'}</div><ol class="steps" id="sA">` +
    A.map((x, i) => li(x, x.bad ? 'bad' : x.skip ? 'skip' : done ? 'done' : 'plan', x.bad ? '!' : x.skip ? '–' : done ? '✓' : i + 1)).join('') + `</ol>`;
  const all = [...document.querySelectorAll('#dB ol.steps li')];
  const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (still){ all.forEach(e => e.classList.add('on')); return; }
  let t = 150;
  all.forEach((e, i) => {
    timers.push(setTimeout(() => { all.forEach(x => x.classList.remove('run')); e.classList.add('on', 'run'); e.scrollIntoView({block:'nearest', behavior:'smooth'}); }, t));
    t += e.classList.contains('bad') ? 1100 : 520;        // 卡住的那一步多停一会儿
  });
  timers.push(setTimeout(() => all.forEach(x => x.classList.remove('run')), t));
}
function openSteps(i){
  cur = {...D[i]};
  const [code, full] = SUP[cur.ca] || ['', cur.ca];
  const st = stage(cur), done = st === 9;
  const pill = done ? `<span class="pill done">已做账 ${cur.vno}</span>` : cur.plan === 'manual' ? '<span class="pill stop">要人工</span>'
    : st === 0 ? '<span class="pill go">可以做账</span>' : `<span class="pill stop">卡在 ${'①②③'[st - 1]}</span>`;
  const dif = Math.round((cur.acc - cur.amt) * 100) / 100;
  document.getElementById('dT').innerHTML = `做账步骤 ${pill}`;
  document.getElementById('dS').innerHTML = `${full} · ${cur.sj}　请款 <span class="mono">${money(cur.amt)}</span>　计提 <span class="mono">${money(cur.acc)}</span>` +
    (dif ? `（比请款${dif > 0 ? '多' : '少'} ${money(Math.abs(dif))}）` : '（一致）');
  document.getElementById('mask').classList.add('on');
  document.getElementById('dClose').focus();
  play();
}
function closeSteps(){ timers.forEach(clearTimeout); timers = []; document.getElementById('mask').classList.remove('on'); }
document.getElementById('tb').addEventListener('click', e => { const b = e.target.closest('[data-steps]'); if (b) openSteps(+b.dataset.steps); });
document.getElementById('dClose').addEventListener('click', closeSteps);
document.getElementById('mask').addEventListener('mousedown', e => { if (e.target.id === 'mask') closeSteps(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSteps(); });
document.getElementById('q').addEventListener('input', render);
document.getElementById('qx').addEventListener('click', () => { const i = document.getElementById('q'); i.value = ''; render(); i.focus(); });
document.getElementById('segInv').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  invRule = b.dataset.v;
  document.querySelectorAll('#segInv button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  render();
});
document.getElementById('tiles').addEventListener('click', e => {
  const b = e.target.closest('.tile'); if (!b) return;
  filt = filt === b.dataset.k ? '' : b.dataset.k;
  render();
});
render();
</script>
